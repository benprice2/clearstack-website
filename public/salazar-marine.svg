<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="600px" viewBox="0 0 800 600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Salazar Marine Work</title>
    <defs>
        <linearGradient x1="0%" y1="0%" x2="100%" y2="100%" id="marineGradient">
            <stop stop-color="#0077B6" offset="0%"></stop>
            <stop stop-color="#00B4D8" offset="100%"></stop>
        </linearGradient>
    </defs>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect fill="url(#marineGradient)" x="0" y="0" width="800" height="600"></rect>
        
        <!-- Water waves -->
        <path d="M0,450 C100,420 200,480 300,450 C400,420 500,480 600,450 C700,420 800,480 800,450 L800,600 L0,600 Z" fill="#ffffff" opacity="0.2"></path>
        <path d="M0,480 C100,450 200,510 300,480 C400,450 500,510 600,480 C700,450 800,510 800,480 L800,600 L0,600 Z" fill="#ffffff" opacity="0.3"></path>
        
        <!-- Boat hull -->
        <path d="M300,350 L500,350 L550,450 L250,450 Z" fill="#D8572A"></path>
        
        <!-- Boat cabin -->
        <rect x="350" y="300" width="100" height="50" fill="#EEEEEE"></rect>
        
        <!-- Boat mast -->
        <rect x="400" y="200" width="5" height="100" fill="#8B4513"></rect>
        
        <!-- Boat sail -->
        <path d="M405,200 L405,300 L480,270 Z" fill="#FFFFFF"></path>
        
        <!-- Paintbrush -->
        <rect x="600" y="300" width="10" height="100" rx="2" fill="#8B4513" transform="rotate(30 600 300)"></rect>
        <path d="M580,270 L620,290 L610,310 L570,290 Z" fill="#FF5252" transform="rotate(30 595 290)"></path>
        
        <!-- Text -->
        <text x="400" y="550" font-family="Arial" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SALAZAR MARINE WORK</text>
    </g>
</svg>
